# The main pipeline for OrdersPortal

resources:
  pipelines:
    OrdersPortal_etl:
      name: OrdersPortal_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/OrdersPortal_etl"

      libraries:
        - glob:
            include: ../src/OrdersPortal_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
