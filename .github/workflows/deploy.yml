
name: Deploy Databricks

on:
  workflow_dispatch:
  push:
    branches: [main]
    
permissions:
  contents: read
  id-token: write

jobs:
  dev:
    uses: ./.github/workflows/deploy-template.yml
    with:
      env: dev
    secrets: inherit

  sit:
    needs: dev
    uses: ./.github/workflows/deploy-template.yml
    with:
      env: sit
    secrets: inherit

  uat:
    needs: sit
    uses: ./.github/workflows/deploy-template.yml
    with:
      env: uat
    secrets: inherit