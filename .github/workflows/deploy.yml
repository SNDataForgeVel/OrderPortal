name: Deploy Databricks
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BUNDLE_VAR_catalog: ${{ vars.CATALOG }}
      BUNDLE_VAR_schema: ${{ vars.SCHEMA }}

    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Deploy
        run: databricks bundle deploy -t dev