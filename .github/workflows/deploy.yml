name: Deploy Databricks
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN  }}
      BUNDLE_VAR_CATALOG: ${{ vars.BUNDLE_VAR_CATALOG }}
      BUNDLE_VAR_SCHEMA: ${{ vars.BUNDLE_VAR_SCHEMA }}
      BUNDLE_VAR_ORDERVOLUMENAME: ${{ vars.BUNDLE_VAR_ORDERVOLUMENAME }}

    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy
        run: databricks bundle deploy -t dev