name: Deploy template
on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}   # approval gate fires here
    permissions:
      id-token: write
      contents: read
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_CATALOG: ${{ vars.CATALOG }}
      BUNDLE_VAR_SCHEMA: ${{ vars.SCHEMA }}
      BUNDLE_VAR_ORDERVOLUMENAME: ${{ vars.ORDERVOLUMENAME }}
      BUNDLE_VAR_CUSTOMERVOLUMENAME: ${{ vars.CUSTOMERVOLUMENAME }}
      BUNDLE_VAR_WAREHOUSEID: ${{ secrets.WAREHOUSEID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t ${{ inputs.env }}
      - run: databricks bundle deploy -t ${{ inputs.env }}
      - run: databricks bundle run create_customers_job -t ${{ inputs.env }}